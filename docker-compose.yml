version: '3.8'
services:
  # app:
  #   build: .
  #   container_name: museum_app
  #   volumes:
  #     - .:/app
  #   ports:
  #     - "5000:5000"
  notebook:
    build: .
    container_name: museum_notebook
    volumes:
      - .:/app
    ports:
      - "8888:8888"
    command: jupyter notebook --ip=0.0.0.0 --port=8888 --allow-root --no-browser --NotebookApp.token=''
  # db:
  #   image: postgres:latest
  #   container_name: museum_db
  #   ports:
  #     - "5432:5432"
  #   environment:
  #     # POSTGRES_USER: user
  #     POSTGRES_PASSWORD: mysecretpassword
  #     POSTGRES_DB: museum_db
  db:
    image: mysql:latest

    container_name: museum_db
    
    ports:
      - "3306:3306"

    volumes:
      - ./db_data:/var/lib/mysql

    environment:
      MYSQL_ROOT_PASSWORD: mysecretpassword
      MYSQL_DATABASE: museum_db
      MYSQL_USER: user
      MYSQL_PASSWORD: mysecretpassword
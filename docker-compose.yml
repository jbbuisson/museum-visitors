version: '3.8'
services:

  notebook:
    build: .
    container_name: museum_notebook
    environment:
    - JUPYTER_CONTAINER=1
    volumes:
      - .:/app
    ports:
      - "8888:8888"
    command: jupyter notebook --ip=0.0.0.0 --port=8888 --allow-root --no-browser --NotebookApp.token=''

  db:
    image: mysql:latest

    container_name: museum_db
    
    ports:
    - "3306:3306"

    volumes:
      - ./db_data:/var/lib/mysql

    environment:
      MYSQL_ROOT_PASSWORD: mysecretpassword
      MYSQL_DATABASE: museum_db
      MYSQL_USER: user
      MYSQL_PASSWORD: mysecretpassword
